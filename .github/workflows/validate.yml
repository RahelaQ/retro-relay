name: Validate theme

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Both scripts are dependency-free, so there is nothing to install.
      - name: Validate manifest and build release payload
        run: node scripts/build-release.mjs

      - name: Check palette contrast (WCAG 2.1 AA)
        run: node scripts/check-contrast.mjs

      - name: Confirm release tag matches manifest version
        if: github.event_name == 'release'
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME}"
          echo "manifest: $manifest_version"
          echo "tag:      $tag"
          # Obsidian looks for a release tagged identically to manifest version.
          # A leading "v" is tolerated here but the tag itself should match.
          if [ "$tag" != "$manifest_version" ] && [ "$tag" != "v$manifest_version" ]; then
            echo "::error::Release tag '$tag' does not match manifest version '$manifest_version'"
            exit 1
          fi

      - name: Upload release payload
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: retro-relay-${{ github.ref_name }}
          path: |
            dist/manifest.json
            dist/theme.css
